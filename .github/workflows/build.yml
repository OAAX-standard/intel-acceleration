name: Build
permissions:
  contents: none

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-toolchain:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build conversion toolchain image
        run: bash conversion-toolchain/build-toolchain.sh

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-toolchain
          path: conversion-toolchain/artifacts/oaax-intel-toolchain.tar
          retention-days: 1

  build-runtimes-for-ubuntu:
    timeout-minutes: 20
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'
          lfs: true

      - name: Set up environment
        run: |
          sudo bash scripts/setup-env.sh
          echo "OPENVINO_DIR=/opt/intel/openvino/runtime" >> "$GITHUB_ENV"

      - name: Cross-compile runtimes
        run: bash runtime-library/build-runtimes.sh

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-runtime-linux-x86_64
          path: runtime-library/artifacts/runtime-library-X86_64.tar.gz
          retention-days: 1

  build-runtimes-for-windows-x86_64:
    timeout-minutes: 10
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'
          lfs: true
      - name: Install OpenVINO
        shell: pwsh
        run: |
          $ovArchive = "openvino_toolkit_windows_2026.1.0.21367.63e31528c62_x86_64.zip"
          $url = "https://storage.openvinotoolkit.org/repositories/openvino/packages/2026.1/windows/$ovArchive"
          Invoke-WebRequest -Uri $url -OutFile openvino.zip
          Expand-Archive -Path openvino.zip -DestinationPath C:\intel -Force
          Remove-Item openvino.zip
          $ovDir = (Get-ChildItem -Path C:\intel -Filter "openvino_toolkit_*" | Select-Object -First 1).FullName
          echo "OPENVINO_DIR=$ovDir\runtime" >> $env:GITHUB_ENV
      - name: Compile runtime
        run: |
          cd runtime-library
          .\build-runtime.bat
      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: build-runtime-windows-x86_64
          path: runtime-library\artifacts\runtime-library-X86_64-Windows.tar.gz
          retention-days: 1

  integration-tests:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    needs: [build-toolchain, build-runtimes-for-ubuntu]
    permissions:
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'
          lfs: true

      - name: Set up environment
        run: |
          sudo bash scripts/setup-env.sh
          echo "OPENVINO_DIR=/opt/intel/openvino/runtime" >> "$GITHUB_ENV"
          echo "CMAKE_BIN=/usr/local/bin/cmake" >> "$GITHUB_ENV"

      - name: Download runtime library
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: build-runtime-linux-x86_64
          path: /tmp/runtime

      - name: Extract runtime library
        run: |
          mkdir -p runtime-library/build
          tar xzf /tmp/runtime/runtime-library-X86_64.tar.gz -C runtime-library/build/

      - name: Download toolchain image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: build-toolchain
          path: /tmp/toolchain

      - name: Load toolchain Docker image
        run: |
          docker load -i /tmp/toolchain/oaax-intel-toolchain.tar
          rm -r /tmp/toolchain

      - name: Set up Python environment
        run: uv sync --extra integration --extra quantization -q

      - name: Stage 1 — convert models and run toolchain tests
        run: uv run python tests/stage1.py

      - name: Upload compiled models
        uses: actions/upload-artifact@v4
        with:
          name: compiled-models
          path: tests/compiled_models/
          retention-days: 1

      - name: Stage 2 — build test binaries and run tests
        run: uv run python tests/stage2.py --duration 5

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-linux
          path: tests/runtime/build/runtime.log
          if-no-files-found: warn

  integration-tests-windows:
    timeout-minutes: 60
    runs-on: windows-latest
    needs: [build-runtimes-for-windows-x86_64, integration-tests]
    permissions:
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: 'recursive'

      - name: Download Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: build-runtime-windows-x86_64
          path: runtime-dl

      - name: Extract Windows runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime-library\build\Release | Out-Null
          tar xzf runtime-dl\runtime-library-X86_64-Windows.tar.gz -C runtime-library\build\Release\
          Remove-Item -Recurse runtime-dl

      - name: Download compiled models
        uses: actions/download-artifact@v4
        with:
          name: compiled-models
          path: tests/compiled_models

      - name: Stage 2 — build test binaries and run tests
        run: python tests/stage2.py

      - name: Upload runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-log-windows
          path: tests/runtime/build/Release/runtime.log
          if-no-files-found: warn

  # ── Publish ─────────────────────────────────────────────────────────────────
  # Runs after every build and test passed and uploads the bytes that were tested:
  #   v* tag               -> <VERSION>/ (write once) and latest/, the release
  #   pull request         -> <branch>/ (overwritten on every run, removed when the PR closes), for testing
  #   anything else, or a PR without secrets (fork, Dependabot) -> dry run: files checked, keys printed

  publish:
    name: Publish to the OAAX bucket
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    needs: [integration-tests, integration-tests-windows]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0  # the tag check below needs main's history

      - name: Tag must match VERSION and be on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "${TAG#v}" = "$(cat VERSION)" ] || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main, tag a commit of main"; exit 1; }

      - name: Download the build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: build-*
          path: artifacts

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Upload to S3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        # The branch name reaches the script only through the environment (GITHUB_HEAD_REF), never through ${{ }}.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mode=release name=$(cat VERSION)
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$S3_ACCESS_KEY" ]; then
            mode=branch name=$GITHUB_HEAD_REF
          else
            mode=dry name=$(cat VERSION)
          fi
          bash scripts/publish-artifacts.sh "$mode" "$name" artifacts
