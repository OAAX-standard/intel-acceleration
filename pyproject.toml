[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-acceleration-tests"
dynamic = ["version"]
description = "Test suite for the OAAX Intel Acceleration runtime and conversion toolchain"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["oaax", "openvino", "intel", "inference", "npu", "gpu", "quantization"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "conversion-toolchain",
    "openvino==2026.1.0",
    "pytest>=7.0",
    "numpy>=1.21",
]

[project.optional-dependencies]
integration = ["ultralytics>=8.3.0"]
quantization = ["nncf>=2.19.0,<3.0.0"]
all = ["intel-acceleration-tests[integration,quantization]"]

[project.urls]
Repository = "https://github.com/OAAX-standard/intel-acceleration"
Documentation = "https://docs.oaax.org/Intel/"
Changelog = "https://github.com/OAAX-standard/intel-acceleration/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.uv.sources]
conversion-toolchain = { path = "conversion-toolchain", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Ruff (lint + format) ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, …)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501",  # line-too-long — enforced by ruff-format instead
]

[tool.ruff.lint.isort]
known-first-party = ["conversion_toolchain"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]  # unused imports / redefinitions common in test files
